[package]
name = "icon-studio-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
icon-studio-core = { path = "../core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
base64 = "0.22"
web-sys = { version = "0.3", features = ["Window","Document","Element","Node","NodeList","Event","EventTarget","KeyboardEvent","MouseEvent","DragEvent","DataTransfer","File","FileList","Blob","BlobPropertyBag","HtmlElement","HtmlInputElement","HtmlSelectElement","HtmlTextAreaElement","HtmlImageElement","HtmlCanvasElement","HtmlAnchorElement","CanvasRenderingContext2d","ImageData","Response","Request","RequestInit","Headers","Storage","Location","Navigator","Clipboard","DomTokenList","console"] }

